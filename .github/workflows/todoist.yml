name: todoist

on:
  push:
    paths: ["packages/todoist/**", ".github/workflows/todoist.yml"]
  pull_request:
    paths: ["packages/todoist/**", ".github/workflows/todoist.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/todoist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/todoist/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
